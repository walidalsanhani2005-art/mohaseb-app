name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Fix package name
        run: |
          sed -i 's/mohaseb-app/mohaseb_app/g' pubspec.yaml
          cat pubspec.yaml | head -n 3

      - name: Create missing Android files
        run: flutter create . --platforms=android

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohaseb_app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
