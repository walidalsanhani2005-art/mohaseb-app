name: Build Secure APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Fix missing project files
        run: |
          ls -la
          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml missing - creating project..."
            cp lib/main.dart /tmp/main_backup.dart
            flutter create --project-name mohaseb_app --org com.mohaseb.app .
            cp /tmp/main_backup.dart lib/main.dart
          fi
          cat pubspec.yaml
          ls -la android/

      - name: Get packages
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
